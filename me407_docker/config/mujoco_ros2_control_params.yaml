# ==============================================================================
# MuJoCo ROS 2 Control Configuration (mujoco_ros2_control)
# Mounted inside the container at: /site_config/mujoco_ros2_control_params.yaml
# ==============================================================================

controller_manager:
  ros__parameters:
    update_rate: 500  # Hz (matches 2 ms MuJoCo physics timestep)
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    omni_wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    payload_position_controller:
      type: position_controllers/JointGroupPositionController

# MuJoCo Simulation Node Parameters
mujoco_ros2_control_node:
  ros__parameters:
    use_sim_time: true
    sim_speed_factor: 1.0
    headless: false
    # Path to your robot MJCF scene XML inside your package or /site_config
    # mujoco_model_path: "/ros2_ws/src/me407_description/mujoco/scene.xml"

omni_wheel_velocity_controller:
  ros__parameters:
    joints:
      - wheel_1_joint
      - wheel_2_joint
      - wheel_3_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
      - effort

payload_position_controller:
  ros__parameters:
    joints:
      - deck_latch_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
