services:
  ros2_mujoco:
    build:
      context: .
      dockerfile: Dockerfile
    image: me407_ros2_mujoco:humble
    container_name: me407_ros2_mujoco
    hostname: me407-docker
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=${XAUTHORITY:-/root/.Xauthority}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - MUJOCO_GL=glfw
      - SITE_CONFIG_DIR=/site_config
      - SSH_AUTH_SOCK=${SSH_AUTH_SOCK:-}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      # 1. X11 socket so GUI apps (RViz2, MuJoCo Viewer) open on your PC screen
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # 2. Persistent colcon workspace (stores build/, install/, log/)
      - ./workspace:/ros2_ws:rw
      # 3. Share the entire omn_software repo inside /ros2_ws/src/omn_software
      - ..:/ros2_ws/src/omn_software:rw
      # 4. Also mount the parent ME407 repo (if present) so Git submodule commands work inside Docker
      - ../../..:/me407_repo:rw
      # 5. Live-shared YAML configuration files
      - ./config:/site_config:rw
      # 6. Host SSH keys & Git identity so git clone / pull / push work inside Docker
      - ${HOME}/.ssh:/root/.ssh:ro
      - ${HOME}/.gitconfig:/etc/gitconfig:ro
      - ${SSH_AUTH_SOCK:-/tmp}:/ssh-agent
    working_dir: /ros2_ws
    command: bash
