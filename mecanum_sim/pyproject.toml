[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mecanum-sim"
version = "1.0.0"
description = "Model-agnostic 4-wheel mecanum AMR simulation platform in MuJoCo"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mujoco>=3.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "pytest>=7.0.0",
]

[project.scripts]
mecanum-sim = "mecanum_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

